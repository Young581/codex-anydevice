name: Cross-platform checks and VSIX build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Source and manifest checks
        run: node scripts/check.js
      - name: Extension commands with synthetic host
        run: node --test tests/extension.test.js tests/setup.test.js tests/runtime.test.js tests/direct.test.js
      - name: Package boundary checks
        run: python -B tests/package_validation.py
      - name: Build development VSIX
        run: python -B build.py --output dist
      - name: Audit the exact development VSIX
        run: python -B packaging/release-audit.py
      - name: Upload development VSIX
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: codex-anydevice-development-vsix
          path: |
            dist/*.vsix
            dist/*.sha256
          if-no-files-found: error

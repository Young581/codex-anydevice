name: 问题反馈 / Bug report
description: 版本、环境与复现步骤 / Versions, environment and reproduction
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请遮盖路径、主机、消息正文及身份；不要上传凭据或原始会话。安全问题见 SECURITY.md。 / Redact private data; never upload credentials or real sessions.
  - type: input
    id: versions
    attributes:
      label: 版本 / Versions
      description: AnyDevice、VS Code、Codex、OpenClaw 与渠道插件 / Include the relevant runtime and plugin versions
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: 消息渠道 / Channel
      options:
        - QQ
        - 微信 / WeChat
        - 无渠道，扩展或打包 / Extension or packaging only
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 项目环境 / Project environment
      options:
        - Windows 本地 / Windows local
        - Linux 本地 / Linux local
        - macOS 本地 / macOS local
        - Remote SSH / 容器 / Container
        - 多种环境 / Multiple environments
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏摘要 / Redacted diagnostics
      description: 仅提供必要错误摘要 / Include necessary error excerpts only
